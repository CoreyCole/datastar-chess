[project]
name = "datastar-chess"
version = "0.1.0"
description = "A real-time chess game built with Datastar, demonstrating reactive web without writing javascript"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "quart>=0.20.0",
  "redis>=5.0.0",
  "chess>=1.10.0",
  "python-dotenv>=1.0.0",
  "faker>=37.1.0",
  "quart-rate-limiter>=0.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
datastar-chess = "app:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = [
    "app.py",
    "templates/",
    "static/",
]

[tool.black]
line-length = 88
target-version = ['py312']

[tool.ruff]
target-version = "py312"
line-length = 88
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501"] 