[project]
name = "datastar-chess"
version = "0.1.0"
description = "A real-time chess game built with Datastar, demonstrating reactive web without writing javascript"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "quart>=0.20.0",
  "redis>=5.0.0",
  "chess>=1.10.0",
  "python-dotenv>=1.0.0",
  "faker>=37.1.0",
  "quart-rate-limiter>=0.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[project.urls]
Documentation = "https://data-star.dev"
Repository = "https://github.com/starfederation/datastar"